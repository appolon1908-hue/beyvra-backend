version: "3.11"
services:
  web:
    build: ./FX
    command: ./web-init-prod.sh
    expose:
      - 8000
    volumes:
     - ./FX/:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  daphne:
    build: ./FX
    command: daphne -b 0.0.0.0 -p 8001 FX.asgi:application
    expose:
      - 8001
    volumes:
     - ./FX/:/app
    env_file:
      - .env
    depends_on:
      - web
    extra_hosts:
      - "localhost:host-gateway"

  postgres:
    image: postgres:12.9-alpine3.15
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  redis:
    image: redis:7.2.3-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

  celery_worker:
    build: ./FX
    entrypoint: ["./worker-entrypoint.sh"]
    env_file:
      - .env

  celery-flower:
    build:
      context: ./FX
    container_name: celery-flower
    env_file:
      - ".env"
    command: >
      bash -c
      "celery -A FX flower --basic_auth=$FLOWER_USERNAME:$FLOWER_PASSWORD"
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker

  chart-data-publisher:
    build: ./FX
    command: python3 api_trade/scripts/fetch_data.py
    env_file:
      - .env
    depends_on:
      - web
      - daphne
      - redis

  nginx:
    build:
      context: ./nginx
      args:
        CONFIG_FILE: nginx.dev.conf.template
    ports:
      - ${PORT}:80
    environment:
      - WEB_HOST=web:8000
      - DAPHNE_HOST=daphne:8001
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
