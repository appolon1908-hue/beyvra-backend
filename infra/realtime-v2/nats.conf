server_name: codestra-staging-nats
port: 4222
http: 8222
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 256MB
  max_file: 2GB
}
max_payload: 1048576
write_deadline: "2s"
tls {
  cert_file: "/etc/nats/tls/server.crt"
  key_file: "/etc/nats/tls/server.key"
  ca_file: "/etc/nats/tls/ca.crt"
  verify: false
}
