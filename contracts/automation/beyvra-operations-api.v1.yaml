openapi: 3.1.0
info:
  title: Beyvra Automation-Safe API
  version: 1.0.0
  description: Private non-financial operations contract invoked only by the Codestra
    Middleware adapter.
servers:
- url: https://beyvra.internal.invalid
security:
- oauth2:
  - beyvra.operations.write
paths:
  /v1/automation/onboarding-cases:
    post:
      operationId: createOnboardingCase
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - account_id
              - reason
              properties:
                account_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/onboarding-cases/{case_id}:
    get:
      operationId: getOnboardingCase
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current state
      security:
      - oauth2:
        - beyvra.operations.read
  /v1/automation/compliance-tasks/{task_id}/remind:
    post:
      operationId: requestComplianceReminder
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/support-escalations:
    post:
      operationId: createSupportEscalation
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - case_id
              - reason
              properties:
                case_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/report-requests:
    post:
      operationId: createReportRequest
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - report_type
              - account_id
              properties:
                report_type:
                  type: string
                  minLength: 1
                  maxLength: 255
                account_id:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/report-requests/{request_id}:
    get:
      operationId: getReportRequest
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current state
      security:
      - oauth2:
        - beyvra.operations.read
  /v1/automation/notifications:
    post:
      operationId: requestNotification
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - template_key
              - recipient_ref
              properties:
                template_key:
                  type: string
                  minLength: 1
                  maxLength: 255
                recipient_ref:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/security-alerts:
    post:
      operationId: createSecurityAlert
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - subject_ref
              - alert_type
              properties:
                subject_ref:
                  type: string
                  minLength: 1
                  maxLength: 255
                alert_type:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/webhook-reconciliation:
    post:
      operationId: reconcileWebhookDelivery
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid command input
        '409':
          description: Idempotency or resource version conflict
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - delivery_id
              - reason
              properties:
                delivery_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
  /v1/automation/operations/{operation_id}:
    get:
      operationId: getAutomationOperation
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Reconciled operation state
      security:
      - oauth2:
        - beyvra.operations.read
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.codestra.co/realms/codestra/protocol/openid-connect/token
          scopes:
            beyvra.operations.write: Request allowlisted non-financial operations
            beyvra.operations.read: Read operation state
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Stable key for exact replay; changed payloads return 409.
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Caller request identifier for audit correlation.
    ExpectedVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Expected version from the target resource read-back.
