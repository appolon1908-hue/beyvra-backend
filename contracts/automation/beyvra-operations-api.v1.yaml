openapi: 3.1.0
info:
  title: Beyvra Automation-Safe API
  version: 1.0.0
  description: Private non-financial operations contract invoked only by the Codestra Middleware adapter.
servers:
  - url: https://beyvra.internal.invalid
security:
  - oauth2: [beyvra.operations.write]
paths:
  /v1/automation/onboarding-cases:
    post:
      operationId: createOnboardingCase
      responses: {'202': {description: Accepted}}
  /v1/automation/onboarding-cases/{case_id}:
    get:
      operationId: getOnboardingCase
      parameters: [{name: case_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Current state}}
  /v1/automation/compliance-tasks/{task_id}/remind:
    post:
      operationId: requestComplianceReminder
      parameters: [{name: task_id, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Accepted}}
  /v1/automation/support-escalations:
    post:
      operationId: createSupportEscalation
      responses: {'202': {description: Accepted}}
  /v1/automation/report-requests:
    post:
      operationId: createReportRequest
      responses: {'202': {description: Accepted}}
  /v1/automation/report-requests/{request_id}:
    get:
      operationId: getReportRequest
      parameters: [{name: request_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Current state}}
  /v1/automation/notifications:
    post:
      operationId: requestNotification
      responses: {'202': {description: Accepted}}
  /v1/automation/security-alerts:
    post:
      operationId: createSecurityAlert
      responses: {'202': {description: Accepted}}
  /v1/automation/webhook-reconciliation:
    post:
      operationId: reconcileWebhookDelivery
      responses: {'202': {description: Accepted}}
  /v1/automation/operations/{operation_id}:
    get:
      operationId: getAutomationOperation
      parameters: [{name: operation_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Reconciled operation state}}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.codestra.co/realms/codestra/protocol/openid-connect/token
          scopes:
            beyvra.operations.write: Request allowlisted non-financial operations
            beyvra.operations.read: Read operation state
