groups:
  - name: beyvra-post-trade
    rules:
      - alert: BeyvraPostTradeCaptureFailures
        expr: increase(beyvra_trade_capture_failures_total[10m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Post-trade capture failures detected"}
      - alert: BeyvraPostTradeReconciliationMismatch
        expr: increase(beyvra_post_trade_reconciliation_violations_total[10m]) > 0
        labels: {severity: critical}
        annotations: {summary: "Post-trade reconciliation mismatch"}
      - alert: BeyvraPostTradeSettlementStuck
        expr: beyvra_settlement_pending_age_seconds{mode="simulation"} > 300
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Simulation settlement remains pending"}
      - alert: BeyvraPostTradeCriticalException
        expr: beyvra_post_trade_exceptions_open{severity="CRITICAL"} > 0
        labels: {severity: critical}
        annotations: {summary: "Critical post-trade exception is open"}
