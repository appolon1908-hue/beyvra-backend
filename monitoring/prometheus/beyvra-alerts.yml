groups:
- name: beyvra-operational-readiness
  rules:
  - alert: BeyvraApiAvailabilityWarning
    expr: sum(rate(beyvra_http_requests_total{status_class="5xx"}[10m])) / clamp_min(sum(rate(beyvra_http_requests_total[10m])), 0.01) > 0.01 and sum(rate(beyvra_http_requests_total[10m])) > 0.1
    for: 10m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "API 5xx ratio exceeds 1%", runbook: "docs/runbooks/API-FAILURE.md"}
  - alert: BeyvraApiAvailabilityCritical
    expr: up{job="beyvra-backend"} == 0 or (sum(rate(beyvra_http_requests_total{status_class="5xx"}[10m])) / clamp_min(sum(rate(beyvra_http_requests_total[10m])), 0.01) > 0.05 and sum(rate(beyvra_http_requests_total[10m])) > 0.1)
    for: 5m
    labels: {severity: critical, owner: platform}
    annotations: {summary: "API unavailable or sustained 5xx ratio", runbook: "docs/runbooks/API-FAILURE.md"}
  - alert: BeyvraApiLatencyWarning
    expr: histogram_quantile(0.95, sum by (le) (rate(beyvra_http_request_duration_seconds_bucket[10m]))) > 0.5 and sum(rate(beyvra_http_requests_total[10m])) > 0.1
    for: 15m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "API p95 exceeds initial engineering SLO", runbook: "docs/runbooks/API-FAILURE.md"}
  - alert: BeyvraOutboxBacklogCritical
    expr: beyvra_outbox_oldest_pending_age_seconds > 30 or time() - beyvra_outbox_worker_last_success_timestamp_seconds > 60
    for: 5m
    labels: {severity: critical, owner: trading}
    annotations: {summary: "Outbox publication is delayed", runbook: "docs/runbooks/OUTBOX-BACKLOG.md"}
  - alert: BeyvraDuplicateBusinessEffectCritical
    expr: increase(beyvra_duplicate_business_effect_detected_total[5m]) > 0 or increase(beyvra_sim_duplicate_settlement_detected_total[5m]) > 0
    labels: {severity: critical, owner: trading}
    annotations: {summary: "Duplicate business effect detected", runbook: "docs/runbooks/DUPLICATE-EFFECT-DETECTED.md"}
  - alert: BeyvraSimulationInvariantCritical
    expr: increase(beyvra_sim_negative_balance_detected_total[5m]) > 0 or increase(beyvra_sim_reservation_leak_detected_total[5m]) > 0 or increase(beyvra_sim_position_accounting_error_total[5m]) > 0
    labels: {severity: critical, owner: trading}
    annotations: {summary: "Simulation accounting invariant violated", runbook: "docs/runbooks/RESERVATION-LEAK.md"}
  - alert: BeyvraJetStreamLagWarning
    expr: max(beyvra_jetstream_consumer_lag) > 1000
    for: 10m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "JetStream consumer lag is sustained", runbook: "docs/runbooks/EXECUTION-CONSUMER-LAG.md"}
  - alert: BeyvraRealtimeCritical
    expr: up{job=~"centrifugo|realtime-bridge"} == 0 or increase(beyvra_realtime_publish_failures_total[5m]) > 5
    for: 5m
    labels: {severity: critical, owner: platform}
    annotations: {summary: "Realtime delivery unavailable", runbook: "docs/runbooks/REALTIME-FAILURE.md"}
  - alert: BeyvraDatabaseCritical
    expr: up{job="postgres-exporter"} == 0 or increase(beyvra_db_connection_errors_total[5m]) > 5
    for: 5m
    labels: {severity: critical, owner: platform}
    annotations: {summary: "PostgreSQL dependency failure", runbook: "docs/runbooks/DATABASE-FAILURE.md"}
  - alert: BeyvraRedisWarning
    expr: up{job="redis-exporter"} == 0 or increase(beyvra_redis_errors_total[10m]) > 10
    for: 10m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "Redis degraded", runbook: "docs/runbooks/REDIS-FAILURE.md"}
  - alert: BeyvraWorkerCritical
    expr: beyvra_worker_up{worker_type=~"outbox_publisher|execution_consumer|realtime_bridge"} == 0 or time() - beyvra_worker_last_success_timestamp_seconds > 120
    for: 5m
    labels: {severity: critical, owner: trading}
    annotations: {summary: "Critical worker unavailable or stale", runbook: "docs/runbooks/EXECUTION-CONSUMER-LAG.md"}
  - alert: BeyvraReconciliationIntegrityCritical
    expr: increase(beyvra_reconciliation_violations_total{check_code=~"DUPLICATE_TRADE|DUPLICATE_SETTLEMENT|OVERFILL|NEGATIVE_BALANCE|RESERVATION_LEAK|POSITION_MISMATCH|MISSING_REQUIRED_OUTBOX|AUDIT_GAP"}[5m]) > 0
    labels: {severity: critical, owner: trading}
    annotations: {summary: "Trading reconciliation detected an integrity violation", runbook: "docs/runbooks/RECONCILIATION-FAILURE.md"}
  - alert: BeyvraReadinessFailureCritical
    expr: probe_success{job="beyvra-readiness"} == 0
    for: 5m
    labels: {severity: critical, owner: platform}
    annotations: {summary: "Backend readiness is persistently failing", runbook: "docs/runbooks/API-FAILURE.md"}
  - alert: BeyvraOutboxGrowingWarning
    expr: delta(beyvra_outbox_pending_events[15m]) > 100
    for: 10m
    labels: {severity: warning, owner: trading}
    annotations: {summary: "Outbox backlog is continuously increasing", runbook: "docs/runbooks/OUTBOX-BACKLOG.md"}
  - alert: BeyvraNatsDisconnectedCritical
    expr: up{job="nats"} == 0
    for: 5m
    labels: {severity: critical, owner: platform}
    annotations: {summary: "NATS is unavailable", runbook: "docs/runbooks/NATS-FAILURE.md"}
  - alert: BeyvraJetStreamRedeliveryWarning
    expr: sum(increase(beyvra_jetstream_redeliveries_total[10m])) > 100
    for: 10m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "JetStream redeliveries are elevated", runbook: "docs/runbooks/NATS-FAILURE.md"}
  - alert: BeyvraRealtimeRecoveryCritical
    expr: increase(beyvra_realtime_snapshot_recovery_failures_total[5m]) > 0
    labels: {severity: critical, owner: trading}
    annotations: {summary: "Realtime canonical snapshot recovery failed", runbook: "docs/runbooks/REALTIME-FAILURE.md"}
  - alert: BeyvraDatabasePoolWarning
    expr: pg_stat_activity_count / clamp_min(pg_settings_max_connections,1) > 0.85
    for: 10m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "PostgreSQL connection capacity is near exhaustion", runbook: "docs/runbooks/DATABASE-FAILURE.md"}
  - alert: BeyvraDatabaseDeadlocksWarning
    expr: increase(pg_stat_database_deadlocks[10m]) > 5 or increase(beyvra_db_deadlocks_total[10m]) > 5
    for: 5m
    labels: {severity: warning, owner: platform}
    annotations: {summary: "PostgreSQL deadlocks are elevated", runbook: "docs/runbooks/DATABASE-FAILURE.md"}
  - alert: BeyvraMarketDataStaleWarning
    expr: max(beyvra_market_data_age_seconds) > 30
    for: 5m
    labels: {severity: warning, owner: trading}
    annotations: {summary: "Market data exceeds the simulation freshness policy", runbook: "docs/runbooks/MARKET-DATA-STALE.md"}
