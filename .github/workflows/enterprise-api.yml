name: Enterprise API integration

on:
  push:
    branches: [feature/beyvra/enterprise-api-foundation-v1]
  pull_request:
    paths:
      - 'FX/**'
      - '.github/workflows/enterprise-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-api-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install isolated Django test dependency
        run: pip install Django==5.2.17
      - name: Verify sensitive cache policies without application or provider initialization
        working-directory: FX
        run: |
          python - <<'PY'
          import sys
          import unittest
          import django
          from django.conf import settings
          settings.configure(SECRET_KEY='ci-only-cache-test', INSTALLED_APPS=[], DATABASES={})
          django.setup()
          suite = unittest.defaultTestLoader.loadTestsFromName('middleware.test_no_store')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  enterprise-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current main ancestry before enterprise approval
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main:refs/remotes/origin/main
          printf 'HEAD_SHA=%s\nBASE_SHA=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse origin/main)"
          git merge-base --is-ancestor origin/main HEAD
