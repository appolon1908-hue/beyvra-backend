name: API contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3 ruff==0.15.6
      - name: Lint and format contract validation code
        run: |
          ruff check scripts/validate_openapi.py scripts/test_validate_openapi.py
          ruff format --check scripts/validate_openapi.py scripts/test_validate_openapi.py
      - name: Test contract validation and all checked-in contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_validate_openapi.py'
          python3 scripts/validate_openapi.py
