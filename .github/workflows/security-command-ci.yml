name: Security command safety

on:
  pull_request:
    paths:
      - 'FX/security/**'
      - 'FX/users/**'
      - 'FX/apps/foundation/**'
      - 'FX/integrations/**'
      - 'FX/FX/**'
      - 'FX/requirements.txt'
      - '.github/workflows/security-command-ci.yml'
  push:
    branches: [main]
    paths:
      - 'FX/security/**'
      - 'FX/users/**'
      - 'FX/apps/foundation/**'
      - 'FX/integrations/**'
      - 'FX/FX/**'
      - 'FX/requirements.txt'
      - '.github/workflows/security-command-ci.yml'

permissions:
  contents: read

concurrency:
  group: security-command-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codestra_ci
          POSTGRES_USER: codestra_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codestra_ci -d codestra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: FX/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r FX/requirements.txt
          pip check
      - name: Run all security tests including command and concurrency regressions
        working-directory: FX
        env:
          DJANGO_SETTINGS_MODULE: FX.test_settings
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-for-checks
          DEBUG: '0'
          ALLOWED_HOSTS: '["localhost","testserver"]'
          CSRF_TRUSTED_ORIGINS: '[]'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ci-only-password
          REDIS_DATABASE: '0'
          DB_NAME: codestra_ci
          DB_USER: codestra_ci
          DB_PASSWORD: ci-only-password
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          TEST_DB_NAME: test_codestra_ci
          TRANSACTIONAL_EMAIL_ENABLED: 'false'
        run: |
          python -m compileall -q security
          python manage.py check
          python manage.py test security.tests --noinput --verbosity 2
