name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FX/requirements.txt
      - name: Install application and audit tools
        run: pip install -r FX/requirements.txt pip-audit bandit
      - name: Compile Python sources
        run: python -m compileall -q FX
      - name: Run Django checks and security regression tests
        working-directory: FX
        env:
          DJANGO_SETTINGS_MODULE: FX.test_settings
          SECRET_KEY: ci-only-secret
          DEBUG: "0"
          ALLOWED_HOSTS: '["localhost","testserver"]'
          CSRF_TRUSTED_ORIGINS: '[]'
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ci-only-password
          REDIS_DATABASE: "0"
        run: |
          python manage.py check --deploy
          python manage.py test wallet.tests.test_transfer_security bank_account_app.test_security trade.test_security users.tests.test_mfa_security
      - name: Scan Python code
        run: bandit -q -lll -r FX -x 'FX/**/tests,FX/**/migrations'
      - name: Audit dependencies
        run: pip-audit -r FX/requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build -t backend-review:${{ github.sha }} FX
      - name: Scan application image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: backend-review:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
