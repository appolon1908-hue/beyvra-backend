name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FX/requirements.txt
      - name: Install application and audit tools
        run: pip install -r FX/requirements.txt pip-audit bandit
      - name: Compile Python sources
        run: python -m compileall -q FX
      - name: Scan Python code
        run: bandit -q -r FX -x 'FX/**/tests,FX/**/migrations'
      - name: Audit dependencies
        run: pip-audit -r FX/requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t backend-review:${{ github.sha }} FX
      - name: Scan application image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: backend-review:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
