{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}
<div class="related-files">
    <h3>Files</h3>
    <ul>
        {% for kycfile in original.files.all %}
            <li><a href="{% url 'admin:users_kycfile_change' kycfile.id %}">{{ kycfile.desc }}</a></li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
