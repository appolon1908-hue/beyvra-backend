[mypy]
python_version = 3.11
files = .
explicit_package_bases = True
exclude = (?x)(^|/)migrations/|(^|/)static/
ignore_missing_imports = True
follow_imports = skip
no_implicit_optional = False
allow_redefinition = True
show_error_codes = True
pretty = True

# Initial repository-wide ratchet. These legacy categories are deliberately
# suppressed while the checker still parses every non-migration Python module
# and enforces undisabled diagnostics. Tighten this list package-by-package.
disable_error_code = import-untyped,var-annotated,attr-defined,valid-type,operator,assignment,return-value,return,misc,abstract,dict-item,arg-type,no-redef,union-attr
