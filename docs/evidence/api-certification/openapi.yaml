openapi: 3.0.3
info:
  title: Tradi Trading API
  version: 1.0.0
  description: Versioned API contract for the Tradi paper-trading platform.
paths:
  /api/admin/dashboard/over_views:
    get:
      operationId: admin_dashboard_over_views_retrieve
      description: Provides an overview of the admin dashboard including user statistics,
        trade data, and system health.
      summary: Admin Dashboard Overview
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/tickets/:
    get:
      operationId: admin_tickets_retrieve
      description: Get a support ticket from the system.
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: The UUID of the support ticket
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      description: Fetch users based on active status, and username. Only accessible
        by admins.
      parameters:
      - in: query
        name: email
        schema:
          type: string
        description: Filter by email (partial, case-insensitive match).
      - in: query
        name: first_name
        schema:
          type: string
        description: Filter by first name.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active status. Pass 'true' or 'false'.
      - in: query
        name: last_name
        schema:
          type: string
        description: Filter by last name.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: phone
        schema:
          type: string
        description: Filter by phone number.
      - in: query
        name: role
        schema:
          type: string
        description: Filter by user role. Pass 'admin' or 'user'.
      - in: query
        name: trader_id
        schema:
          type: integer
        description: Filter by trading id.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: You are not authorized to perform this action.
          description: ''
  /api/admin/users/{user_id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
          description: ''
    patch:
      operationId: admin_users_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: User updated successfully.
          description: ''
    delete:
      operationId: admin_users_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/users/{user_id}/ban/:
    post:
