  /api/charts/info/:
    get:
      operationId: getCryptocurrencyInfo
      description: Retrieve detailed information about one or more cryptocurrencies
        using various filtering options.
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: 'Alternatively, pass in a contract address. Example: ''0xc40af1e4fecfa05ce6bab79dcd8b373d2e436c4e''.'
      - in: query
        name: aux
        schema:
          type: string
        description: Optionally specify a comma-separated list of supplemental data
          fields to return. Valid values include 'urls,logo,description,tags,platform,date_added,notice,status'.
          To include all fields, pass 'urls,logo,description,tags,platform,date_added,notice,status'.
      - in: query
        name: id
        schema:
          type: string
        description: 'One or more comma-separated CoinMarketCap cryptocurrency IDs.
          Example: ''1,2''.'
      - in: query
        name: skip_invalid
        schema:
          type: boolean
          default: false
        description: Pass 'true' to relax request validation rules. When requesting
          multiple cryptocurrencies, an error is returned if any invalid cryptocurrencies
          are requested or if there is no matching record. Setting this to 'true'
          skips invalid lookups, returning valid results.
      - in: query
        name: slug
        schema:
          type: string
        description: 'Alternatively, pass a comma-separated list of cryptocurrency
          slugs. Example: ''bitcoin,ethereum''.'
      - in: query
        name: symbol
        schema:
          type: string
        description: 'Alternatively, pass one or more comma-separated cryptocurrency
          symbols. Example: ''BTC,ETH''. At least one of ''id'', ''slug'', or ''symbol''
          is required. For non-unique symbols, results will include all matches as
          an array.'
      tags:
      - charts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/charts/listings/historical/:
    get:
      operationId: getCryptocurrencyListingHistorical
      description: |-
        Retrieve a ranked and sorted list of all cryptocurrencies for a historical UTC date.

        This endpoint returns daily ranking snapshots from the end of each UTC day, starting from 2013-04-28. Data can be sorted and paginated according to various parameters. Use the required `date` parameter to specify the snapshot date in Unix timestamp or ISO 8601 format (e.g., '2019-10-10').
      parameters:
      - in: query
        name: aux
        schema:
          type: string
        description: 'Optionally specify a comma-separated list of supplemental data
          fields to return. Supported values include: ''platform'', ''tags'', ''date_added'',
          ''circulating_supply'', ''total_supply'', ''max_supply'', ''cmc_rank'',
          ''num_market_pairs''. Pass ''platform,tags,date_added,circulating_supply,total_supply,max_supply,cmc_rank,num_market_pairs''
          to include all fields.'
      - in: query
        name: convert
        schema:
          type: string
        description: Optionally calculate market quotes in up to 120 currencies by
          passing a comma-separated list of cryptocurrency or fiat symbols (e.g.,
          'BTC,USD'). Each additional convert option requires an additional call credit.
      - in: query
        name: convert_id
        schema:
          type: string
        description: Optionally calculate market quotes by CoinMarketCap ID instead
          of symbols (e.g., '1,2781'). Cannot be used with 'convert'.
      - in: query
        name: cryptocurrency_type
        schema:
          type: string
          default: all
        description: 'The type of cryptocurrency to include. Default is ''all''. Supported
          values: ''all'', ''coins'', ''tokens''.'
      - in: query
        name: date
        schema:
          type: string
        description: The date (Unix timestamp or ISO 8601) to reference the day of
          the snapshot (required).
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          default: 100
        description: The number of results to return. Use with 'start' for pagination.
          Default is 100. Max is 5000.
      - in: query
        name: sort
        schema:
          type: string
          default: cmc_rank
        description: 'The field to sort the list of cryptocurrencies by. Default is
          ''cmc_rank''. Supported values include: ''cmc_rank'', ''name'', ''symbol'',
          ''market_cap'', ''price'', ''circulating_supply'', ''total_supply'', ''max_supply'',
          ''num_market_pairs'', ''volume_24h'', ''percent_change_1h'', ''percent_change_24h'',
          ''percent_change_7d''.'
      - in: query
        name: sort_dir
        schema:
          type: string
          default: desc
        description: 'The direction in which to sort the list. Default is ''desc''.
          Supported values: ''asc'', ''desc''.'
      - in: query
        name: start
        schema:
          type: integer
          default: 1
        description: Optionally offset the start (1-based index) of the paginated
          list of items to return. Default is 1.
      tags:
      - charts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
