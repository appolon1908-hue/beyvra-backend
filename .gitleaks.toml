[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455 WebSocket handshake fixture used by the staging health probe"
regexTarget = "match"
regexes = [
  '''Sec-WebSocket-Key:\s+Y2VydGlmaWNhdGlvbi10ZXN0''',
]

[[allowlists]]
description = "Deleted generated Trivy image inventory contained the public Python image GPG key metadata"
paths = [
  '''^docs/evidence/disaster-recovery/latest/container-scans/backend\.json$''',
]

[[allowlists]]
description = "Reviewed SHA-256 of the immutable Middleware connector CI workflow; not credential material"
condition = "AND"
paths = ['''^\.codestra/validate-production-orchestrator-contract\.py$''']
regexTarget = "line"
regexes = ['''917ab06febf30f0d81146fc147794dace9510f7bb0a6fb903dd69b2244d4e1d0''']
