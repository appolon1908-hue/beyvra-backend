mappings:
  - match: "*.gunicorn.request.status.*"
    help: "gunicorn response code"
    name: "gunicorn_response_code"
    labels:
      app: "$1"
      status: "$2"
  - match: "*.gunicorn.workers"
    name: "gunicorn_workers"
    labels:
      app: "$1"
  - match: "*.gunicorn.requests"
    name: "gunicorn_requests"
    labels:
      app: "$1"
  - match: "*.gunicorn.request.duration"
    name: "gunicorn_request_duration"
    labels:
      app: "$1"
  - match: "codestra.staging.nginx_upstream_probe.ok"
    name: "codestra_staging_nginx_upstream_probe_ok"
  - match: "codestra.staging.auth_endpoint.available"
    name: "codestra_staging_auth_endpoint_available"
  - match: "codestra.staging.websocket_upstream.available"
    name: "codestra_staging_websocket_upstream_available"
  - match: "codestra.staging.centrifugo.available"
    name: "codestra_staging_centrifugo_available"
  - match: "codestra.staging.nginx.http_502_2m"
    name: "codestra_staging_nginx_http_502_2m"
  - match: "codestra.staging.nginx.connection_refused_2m"
    name: "codestra_staging_nginx_connection_refused_2m"
  - match: "codestra.staging.nginx.dns_failure_2m"
    name: "codestra_staging_nginx_dns_failure_2m"
  - match: "codestra.staging.nginx_upstream_probe.timestamp"
    name: "codestra_staging_nginx_upstream_probe_timestamp_seconds"
