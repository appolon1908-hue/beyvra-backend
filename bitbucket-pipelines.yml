image: python:3.11-slim-bookworm

pipelines:
  default:
    - step:
        name: Backend validation
        caches:
          - pip
        script:
          - pip install --no-cache-dir -r FX/requirements.txt
          - export DJANGO_SETTINGS_MODULE=FX.test_settings
          - export SECRET_KEY=ci-only-secret-key-at-least-32-bytes-long
          - export DEBUG=0
          - export ALLOWED_HOSTS='["testserver","localhost"]'
          - export CSRF_TRUSTED_ORIGINS='["http://localhost"]'
          - export REDIS_HOST=localhost REDIS_PORT=6379 REDIS_PASSWORD='' REDIS_DATABASE=0
          - python FX/manage.py check
          - python FX/manage.py test users.tests.test_mfa_security wallet.tests.test_transfer_security --noinput
  branches:
    main:
      - step:
          name: Build production image
          services:
            - docker
          script:
            - docker build -t tradx-backend:${BITBUCKET_COMMIT} FX
