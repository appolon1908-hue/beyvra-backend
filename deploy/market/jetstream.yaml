# Staging-only bounded streams. PostgreSQL remains authoritative for durable
# application state; JetStream is transport/replay infrastructure.
streams:
  MARKET_TICKS: {subjects: ["market.tick.*"], max_age: "15m", max_msgs: 100000, storage: file}
  MARKET_QUOTES: {subjects: ["market.quote.*"], max_age: "15m", max_msgs: 100000, storage: file}
  MARKET_CANDLES: {subjects: ["market.candle.*.*"], max_age: "7d", max_msgs: 500000, storage: file}
  MARKET_ORDERBOOK: {subjects: ["market.orderbook.*"], max_age: "15m", max_msgs: 100000, storage: file}
  MARKET_TRADES: {subjects: ["market.trade.*"], max_age: "1h", max_msgs: 250000, storage: file}
  MARKET_STATUS: {subjects: ["market.status.*"], max_age: "7d", max_msgs: 10000, storage: file}
  NEWS_EVENTS: {subjects: ["news.article.*", "news.alert.*"], max_age: "30d", max_msgs: 100000, storage: file}
  ECONOMIC_EVENTS: {subjects: ["news.economic.*"], max_age: "90d", max_msgs: 100000, storage: file}
defaults:
  duplicate_window: "2m"
  ack_policy: explicit
  replay_policy: instant
  max_ack_pending: 1000
  dead_letter_subject: "market.dead-letter"
